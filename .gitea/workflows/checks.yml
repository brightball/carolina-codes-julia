# One Gitea Actions job per check, after a shared prepare job.
# Not a single combined job.
#
# act_runner starts a new container per job, so jobs cannot share a live
# filesystem. Prepare clones GITHUB_SHA with the job token over HTTPS,
# installs Julia 1.12, Semgrep, Trivy 0.74.0, gitleaks 8.30.1, and
# Pkg.instantiate for the app and format projects, then publishes that
# tree through the Gitea artifact API (curl, no Node). Official Node
# artifact actions treat Gitea as GHES and abort.
#
# Check jobs restore that environment and run only their make target.
# They do not needs: each other, so they run in parallel after prepare.
# They do not re-clone or re-install the shared toolchain.
#
# Empty runner image: clone GITHUB_SHA with the job token over HTTPS.
# Gitea git HTTP returns 401 without the token. Do not initialize a new
# repository or set a default-branch git config here.
name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

# Shared restore step. Not a job. YAML anchor so check jobs do not each
# re-clone or re-install; they download the prepared-env artifact.
x-restore-prepared-env: &restore-prepared-env
  run: |
    set -euo pipefail
    token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
    if [ -z "$token" ]; then echo "missing job token" >&2; exit 1; fi
    out=/tmp/ci-env.sh
    api="${GITHUB_SERVER_URL%/}/api/v1/repos/${GITHUB_REPOSITORY}/raw/scripts/ci-env.sh?ref=${GITHUB_SHA}"
    if ! curl -fsSL -H "Authorization: token ${token}" "$api" -o "$out" || ! grep -q cmd_restore "$out"; then
      host="${GITHUB_SERVER_URL#https://}"
      host="${host#http://}"
      scheme=https
      case "${GITHUB_SERVER_URL}" in http://*) scheme=http ;; esac
      curl -fsSL "${scheme}://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}/raw/commit/${GITHUB_SHA}/scripts/ci-env.sh" -o "$out"
    fi
    grep -q cmd_restore "$out"
    bash /tmp/ci-env.sh restore
    export PATH="${HOME}/.local/bin:${HOME}/.juliaup/bin:${PATH}"

jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          git remote set-url origin "https://${host}/${GITHUB_REPOSITORY}"
      - run: bash scripts/ci-env.sh prepare

  test:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: |
          export PATH="${HOME}/.local/bin:${HOME}/.juliaup/bin:${PATH}"
          make test

  sast:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: |
          export PATH="${HOME}/.local/bin:${HOME}/.juliaup/bin:${PATH}"
          make sast

  audit:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: |
          export PATH="${HOME}/.local/bin:${HOME}/.juliaup/bin:${PATH}"
          make audit

  gitleaks:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: |
          export PATH="${HOME}/.local/bin:${HOME}/.juliaup/bin:${PATH}"
          make gitleaks

  format:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.12-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - *restore-prepared-env
      - run: |
          export PATH="${HOME}/.local/bin:${HOME}/.juliaup/bin:${PATH}"
          make format
